services:
  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APPWRITE_ENDPOINT=https://cloud.appwrite.io/v1
      - NEXT_PUBLIC_APPWRITE_PROJECT_ID=6a1c1298003a00ab38a0
      - APPWRITE_ENDPOINT=https://cloud.appwrite.io/v1
      - APPWRITE_PROJECT_ID=6a1c1298003a00ab38a0
      - APPWRITE_API_KEY=${APPWRITE_API_KEY}
      - APPWRITE_DATABASE_ID=${APPWRITE_DATABASE_ID}
      - APPWRITE_USERS_COLLECTION_ID=${APPWRITE_USERS_COLLECTION_ID}
      - APPWRITE_BIOMETRICS_COLLECTION_ID=${APPWRITE_BIOMETRICS_COLLECTION_ID}
      - APPWRITE_AUDIT_COLLECTION_ID=${APPWRITE_AUDIT_COLLECTION_ID}
      - APPWRITE_STORAGE_BUCKET_ID=${APPWRITE_STORAGE_BUCKET_ID}

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    ports:
      - '8000:8000'
    environment:
      - APPWRITE_ENDPOINT=https://cloud.appwrite.io/v1
      - APPWRITE_PROJECT_ID=6a1c1298003a00ab38a0
      - APPWRITE_API_KEY=${APPWRITE_API_KEY}
      - APPWRITE_DATABASE_ID=${APPWRITE_DATABASE_ID}
      - APPWRITE_USERS_COLLECTION_ID=${APPWRITE_USERS_COLLECTION_ID}
      - APPWRITE_BIOMETRICS_COLLECTION_ID=${APPWRITE_BIOMETRICS_COLLECTION_ID}
      - APPWRITE_AUDIT_COLLECTION_ID=${APPWRITE_AUDIT_COLLECTION_ID}
      - APPWRITE_STORAGE_BUCKET_ID=${APPWRITE_STORAGE_BUCKET_ID}
      - VERIFICATION_THRESHOLD=0.6
